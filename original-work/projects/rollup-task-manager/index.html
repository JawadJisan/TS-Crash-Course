<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #111827;
        --muted: #6b7280;
        --success: #16a34a;
        --danger: #dc2626;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: var(--text);
      }

      .app {
        max-width: 720px;
        margin: 48px auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 2rem;
      }

      .task-form {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      .task-form input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
      }

      .task-form button,
      .filter-group button,
      .task-item button {
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .task-form button {
        background: var(--primary);
        color: white;
        padding: 12px 18px;
        font-weight: 600;
      }

      .task-form button:hover {
        background: var(--primary-dark);
      }

      .filter-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .filter-group button {
        background: #f3f4f6;
        color: var(--text);
        padding: 8px 12px;
      }

      .filter-group button.active {
        background: var(--primary);
        color: white;
      }

      .task-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: #fafafa;
      }

      .task-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }

      .task-main input[type='checkbox'] {
        width: 18px;
        height: 18px;
      }

      .task-text {
        flex: 1;
        word-break: break-word;
      }

      .task-item.completed .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-actions {
        display: flex;
        gap: 8px;
      }

      .task-item button {
        padding: 8px 10px;
      }

      .delete-btn {
        background: rgba(220, 38, 38, 0.1);
        color: var(--danger);
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 18px 0;
      }

      .stats {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Task Manager</h1>

      <form id="task-form" class="task-form">
        <input
          id="task-input"
          type="text"
          placeholder="Add a new task..."
          aria-label="New task"
          maxlength="120"
        />
        <button type="submit">Add Task</button>
      </form>

      <div class="filter-group" aria-label="Task filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>No tasks yet. Add one above.</p>
      <div id="stats" class="stats">0 tasks left</div>
    </main>

    <script src="./dist/bundle.js" defer></script>
  </body>
</html>
