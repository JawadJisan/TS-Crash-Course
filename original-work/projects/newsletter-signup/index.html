<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter Signup</title>
  </head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7ff, #eaf1ff);
      color: #1f2937;
    }

    .newsletter {
      width: min(90%, 460px);
      padding: 32px 28px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
      text-align: center;
    }

    .newsletter h2 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #111827;
    }

    .newsletter p {
      margin: 0 0 22px;
      color: #6b7280;
      line-height: 1.5;
    }

    .form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .email-input {
      flex: 1 1 220px;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .email-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .subscribe-btn {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .subscribe-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.22);
    }
  </style>

  <body>
    <section class="newsletter">
      <h2>Subscribe</h2>
      <p>
        Get weekly tips, updates, and exclusive content straight to your inbox.
      </p>

      <form class="form">
        <input
          class="email-input"
          id="email"
          type="text"
          placeholder="Enter your email address"
          aria-label="Email address"
        />
        <button id="send" class="subscribe-btn">Subscribe</button>
      </form>
    </section>

    <script src="script.js"></script>
  </body>
</html>
